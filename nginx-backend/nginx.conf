geoip2 /usr/share/geoip/GeoLite2-Country.mmdb {
    auto_reload 5m;
    $geoip2_data_country_code default=XX source=$remote_addr country iso_code;
}

server {
    set_real_ip_from  172.0.0.0/8; 
    set_real_ip_from  192.168.0.0/16;
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  frontend;

    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    listen 80;
    root /app/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Country-Code $geoip2_data_country_code;

    }

    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_COUNTRY_CODE $geoip2_data_country_code;
    }
}