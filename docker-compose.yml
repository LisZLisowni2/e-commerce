services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./geoip:/usr/share/geoip
      - /config/www
    healthcheck:
      test: ["CMD", "service", "ngnix", "status"]
      retries: 3
      timeout: 5s
    networks:
      - default
    depends_on:
      - backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "service", "php-fpm", "status"]
      retries: 3
      timeout: 5s
    networks:
      - default
    depends_on:
      - pgsql
  nginx-backend:
    image: lscr.io/linuxserver/nginx:latest
    volumes:
      - ./nginx-backend/nginx.conf:/config/nginx/site-confs/default.conf
      - ./backend:/app
      - ./geoip:/usr/share/geoip
      - /config/www
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "service", "ngnix", "status"]
      retries: 3
      timeout: 5s
    ports:
      - "80:80"
    networks:
      - default
  pgsql:
    image: postgres:18-alpine
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "ecommerance", "-U", "postgres"]
      retries: 3
      timeout: 5s
    volumes:
      - pgdata:/var/lib/postgresql
    secrets:
      - pgsql_password
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/pgsql_password
    networks:
      - default
  geoip-updater:
    image: maxmindinc/geoipupdate
    env_file: .env
    volumes:
      - ./geoip:/usr/share/geoip 
    environment:
      - GEOIPUPDATE_ACCOUNT_ID=${MAXMIND_ACCOUNT_ID}
      - GEOIPUPDATE_LICENSE_KEY=${MAXMIND_LICENSE_KEY}
      - GEOIPUPDATE_EDITION_IDS=GeoLite2-Country
      - GEOIPUPDATE_DB_DIR=/usr/share/geoip
      - GEOIPUPDATE_FREQUENCY=168 

volumes:
  pgdata:

networks:
  default:
    driver: bridge

secrets:
  pgsql_password:
    file: pgsql_password.txt